<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retail Analytics · Capability</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--ink:#0a0a14;--surface:#12121f;--card:#1a1a2e;--border:#2a2a45;--primary:#6366f1;--primary-light:#818cf8;--accent:#f59e0b;--text:#e2e8f0;--muted:#94a3b8;--green:#10b981;}
    *{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}
    body{background:var(--ink);color:var(--text);font-family:"Plus Jakarta Sans",sans-serif;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
    .fu{animation:fadeUp .6s ease both;}.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}
    .section-label{font-family:"JetBrains Mono",monospace;font-size:.72rem;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
    .domain-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;transition:all .22s;}
    .domain-card:hover{border-color:rgba(245,158,11,.35);box-shadow:0 10px 32px rgba(0,0,0,.35);transform:translateY(-2px);}
    nav a{transition:color .2s;}a{text-decoration:none;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const GH=()=>(<svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>);
const Nav=()=>(<nav style={{background:"rgba(10,10,20,.95)",backdropFilter:"blur(16px)",borderBottom:"1px solid var(--border)",position:"sticky",top:0,zIndex:50}}><div style={{maxWidth:"1100px",margin:"0 auto",padding:"0 24px",display:"flex",alignItems:"center",justifyContent:"space-between",height:"60px"}}><a href="./index.html" style={{fontWeight:700,fontSize:"1rem",color:"var(--text)"}}><span style={{color:"var(--primary-light)"}}>Retail</span> Analytics</a><div style={{display:"flex",gap:"20px",alignItems:"center",fontSize:".85rem"}}><a href="./engineering.html" style={{color:"var(--muted)"}}>Engineering</a><a href="./product.html" style={{color:"var(--muted)"}}>Product</a><a href="./capability.html" style={{color:"var(--accent)",fontWeight:600}}>Capability</a><a href="./executive.html" style={{color:"var(--muted)"}}>Executive</a><a href="https://github.com/arvind3/retail_analytics" target="_blank" style={{color:"var(--muted)",border:"1px solid var(--border)",padding:"5px 12px",borderRadius:"6px",display:"flex",alignItems:"center",gap:"6px",fontFamily:"JetBrains Mono",fontSize:".78rem"}}><GH/> GitHub</a></div></div></nav>);
const Hero=()=>(<section style={{padding:"80px 24px 64px",textAlign:"center",background:"var(--ink)",borderBottom:"1px solid var(--border)"}}><div style={{maxWidth:"820px",margin:"0 auto",position:"relative"}}><div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse 80% 60% at 50% 0%,rgba(245,158,11,0.1),transparent)",pointerEvents:"none"}}/><div className="fu" style={{marginBottom:"16px"}}><span style={{background:"rgba(245,158,11,.1)",border:"1px solid rgba(245,158,11,.25)",color:"var(--accent)",borderRadius:"20px",padding:"4px 14px",fontSize:".75rem",fontFamily:"JetBrains Mono",fontWeight:500}}>Capability Perspective</span></div><h1 className="fu d1" style={{fontSize:"clamp(2rem,5vw,3.2rem)",fontWeight:800,lineHeight:1.15,letterSpacing:"-.03em",marginBottom:"18px"}}>This is not just a retail analytics tool.<br/><span style={{background:"linear-gradient(135deg,#f59e0b,#6366f1)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",backgroundClip:"text"}}>It is a proof-of-concept for zero-infrastructure intelligence.</span></h1><p className="fu d2" style={{fontSize:"1.05rem",color:"var(--muted)",lineHeight:1.8,maxWidth:"620px",margin:"0 auto"}}>The architecture — DuckDB-WASM + Parquet + static hosting — is domain-agnostic. Today it serves retail CPG analytics. Tomorrow it can serve any data-intensive domain that wants to eliminate backend infrastructure.</p></div></section>);
const CrossDomain=()=>{const domains=[{domain:"Retail & CPG (Core)",color:"var(--accent)",problem:"Category managers lack timely promo lift, basket analysis, and customer segment data to make weekly buying decisions.",application:"Pre-built dashboards (Executive, Insights, SQL Studio) query the completejourney Parquet dataset directly in the browser.",impact:"Reduction in time-to-insight from 2–3 days to under 5 seconds. Zero BI licence cost.*"},{domain:"E-commerce & Digital Retail",color:"var(--primary-light)",problem:"Digital merchandising teams need to understand funnel cohorts, product affinity, and campaign attribution without a data engineer.",application:"Swap the retail Parquet for a clickstream dataset. The DuckDB-WASM + ECharts pattern works identically.",impact:"Self-serve funnel and cohort analysis for product and growth teams without a backend query service.*"},{domain:"Consumer Goods / Supplier",color:"var(--green)",problem:"Supplier category teams need in-store performance visibility without access to the retailer's BI environment.",application:"Retailers can package a Parquet extract of anonymised sell-through data and share it as a static URL.",impact:"Supplier teams get live performance dashboards with zero data sharing infrastructure.*"},{domain:"Academic & Research",color:"#ec4899",problem:"Researchers and students need to run SQL analytics on public datasets without cloud compute budgets.",application:"Package any public dataset as Parquet, deploy to GitHub Pages, share a URL. Full OLAP SQL in any browser.",impact:"Zero-cost reproducible analytics for academic papers, teaching, and open data journalism.*"},{domain:"Healthcare Operations*",color:"#f97316",problem:"Hospital operations teams need patient flow analytics without PHI leaving the hospital network.",application:"DuckDB-WASM processes data client-side — data never leaves the browser or the local network.",impact:"Privacy-compliant operational analytics with zero infrastructure footprint.*"},{domain:"Financial Services*",color:"#34d399",problem:"Risk teams need ad-hoc queries on transaction datasets without provisioning secure cloud environments.",application:"Deploy Parquet extracts to an internal static host. Same DuckDB-WASM front-end runs on-premises.",impact:"Rapid ad-hoc analysis with full data locality guarantees. No external API calls.*"}];return(<section style={{padding:"64px 24px",maxWidth:"1100px",margin:"0 auto"}}><p className="section-label">Cross-Domain Applications</p><h2 style={{fontSize:"1.75rem",fontWeight:700,marginBottom:"36px"}}>Where this architecture creates value</h2><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:"16px"}}>{domains.map((d,i)=>(<div key={i} className="domain-card" style={{borderTop:`3px solid ${d.color}`}}><div style={{fontWeight:700,fontSize:"1rem",color:d.color,marginBottom:"12px"}}>{d.domain}</div><div style={{marginBottom:"10px"}}><p style={{fontFamily:"JetBrains Mono",fontSize:".68rem",color:"var(--muted)",letterSpacing:".08em",textTransform:"uppercase",marginBottom:"5px"}}>Problem</p><p style={{fontSize:".83rem",color:"var(--muted)",lineHeight:1.65}}>{d.problem}</p></div><div style={{marginBottom:"10px"}}><p style={{fontFamily:"JetBrains Mono",fontSize:".68rem",color:d.color,letterSpacing:".08em",textTransform:"uppercase",marginBottom:"5px"}}>Application</p><p style={{fontSize:".83rem",color:"var(--text)",lineHeight:1.65}}>{d.application}</p></div><div style={{borderTop:"1px solid var(--border)",paddingTop:"10px"}}><p style={{fontFamily:"JetBrains Mono",fontSize:".68rem",color:"var(--green)",letterSpacing:".08em",textTransform:"uppercase",marginBottom:"5px"}}>Potential Impact</p><p style={{fontSize:".83rem",color:"var(--muted)",lineHeight:1.65}}>{d.impact}</p></div></div>))}</div></section>);};
const BuildingBlocks=()=>{const blocks=[{n:"DuckDB-WASM Engine",d:"Full ANSI SQL, window functions, aggregations, and Parquet-native I/O — compiled to WASM, running in any browser. Replace the dataset; keep the engine."},{n:"Parquet Data Model",d:"Any tabular dataset can be converted to Parquet and served from a static host. The engine handles predicate pushdown and columnar projection automatically."},{n:"React + ECharts UI Layer",d:"A composable component library (Chart, StatCard, Table, Tabs, Skeleton) that renders any DuckDB query result as an interactive visualisation."},{n:"GitHub Pages + Actions",d:"Zero-cost static hosting and automated CI/CD. Any team with a GitHub account can deploy this pattern at no infrastructure cost."},{n:"SQL Studio (open interface)",d:"A code editor wired directly to DuckDB-WASM — any SQL query, any result shape, any chart type. Extensible to external query sources."}];return(<section style={{padding:"0 24px 64px",maxWidth:"1100px",margin:"0 auto"}}><p className="section-label">Capability Building Blocks</p><h2 style={{fontSize:"1.75rem",fontWeight:700,marginBottom:"36px"}}>What makes this reusable and extensible</h2><div style={{display:"flex",flexDirection:"column",gap:"14px"}}>{blocks.map((b,i)=>(<div key={i} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:"12px",padding:"20px 24px",display:"grid",gridTemplateColumns:"auto 1fr",gap:"20px",alignItems:"flex-start"}}><div style={{width:"36px",height:"36px",borderRadius:"8px",background:"rgba(245,158,11,.12)",border:"1px solid rgba(245,158,11,.25)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:".85rem",color:"var(--accent)",flexShrink:0}}>{i+1}</div><div><p style={{fontWeight:700,fontSize:".95rem",marginBottom:"6px",color:"var(--text)"}}>{b.n}</p><p style={{fontSize:".84rem",color:"var(--muted)",lineHeight:1.7}}>{b.d}</p></div></div>))}</div></section>);};
const CombinationPlays=()=>{const plays=[{title:"Retail Analytics + Segment CDP",tools:["Retail Analytics (this)","Segment / mParticle","Customer ID join"],desc:"Export a customer-id-keyed Parquet from your CDP. Load it into the SQL Studio. Instantly join behavioural event data with in-store transaction history — cohort analysis that previously required a data engineer.*"},{title:"Retail Analytics + Snowflake (air-gapped export)",tools:["Snowflake unload → S3","Parquet export script","Retail Analytics UI"],desc:"Schedule a nightly Snowflake COPY INTO that exports the prior day's transactions to Parquet on S3. Point the data path to the S3 URL. Decision-makers get yesterday's data in today's browser — no Snowflake licence required for consumers.*"},{title:"Retail Analytics + Supplier Portals",tools:["Retailer data extract","Anonymous Parquet","Shared static URL"],desc:"Package a supplier-scoped view of sell-through data as Parquet. Host on a CDN. Share the URL. Suppliers get live, interactive dashboards without accessing the retailer's BI environment.*"}];return(<section style={{padding:"0 24px 64px",maxWidth:"1100px",margin:"0 auto"}}><p className="section-label">Combination Plays</p><h2 style={{fontSize:"1.75rem",fontWeight:700,marginBottom:"36px"}}>Compound value when paired with other tools</h2><div style={{display:"flex",flexDirection:"column",gap:"20px"}}>{plays.map((p,i)=>(<div key={i} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"14px",padding:"24px 28px",display:"grid",gridTemplateColumns:"1fr auto",gap:"24px",alignItems:"start"}}><div><h3 style={{fontSize:"1.05rem",fontWeight:700,marginBottom:"10px",color:"var(--text)"}}>{p.title}</h3><p style={{fontSize:".86rem",color:"var(--muted)",lineHeight:1.75}}>{p.desc}</p></div><div style={{display:"flex",flexDirection:"column",gap:"6px",flexShrink:0}}>{p.tools.map((t,j)=>(<span key={j} style={{background:"rgba(245,158,11,.08)",border:"1px solid rgba(245,158,11,.2)",borderRadius:"6px",padding:"4px 10px",fontSize:".72rem",fontFamily:"JetBrains Mono",color:"var(--accent)",whiteSpace:"nowrap"}}>{t}</span>))}</div></div>))}</div></section>);};
const Emerging=()=>(<section style={{padding:"0 24px 64px",maxWidth:"1100px",margin:"0 auto"}}><p className="section-label">Emerging Opportunity</p><h2 style={{fontSize:"1.75rem",fontWeight:700,marginBottom:"20px"}}>Where this is headed as technology matures</h2><div style={{background:"linear-gradient(135deg,rgba(99,102,241,.06),rgba(245,158,11,.06))",border:"1px solid rgba(245,158,11,.2)",borderRadius:"14px",padding:"32px"}}><p style={{fontSize:"1rem",color:"var(--text)",lineHeight:1.85,marginBottom:"18px"}}>WASM runtimes are maturing rapidly. DuckDB-WASM today supports single-node in-browser analytics; the next generation will handle multi-file federation, streaming Parquet from object storage, and shared WASM workers across browser tabs. As WASM becomes a first-class deployment target, the gap between in-browser and cloud data warehouse closes to near zero.</p><p style={{fontSize:"1rem",color:"var(--muted)",lineHeight:1.85,marginBottom:"18px"}}>Simultaneously, the cost of cloud BI infrastructure is creating pressure for leaner architectures. Teams that previously required Snowflake + Looker + a data engineering team are discovering that a curated Parquet file and a DuckDB-WASM front-end deliver 80% of the value at 5% of the cost.*</p><p style={{fontSize:"1rem",color:"var(--muted)",lineHeight:1.85}}>This platform is an early demonstration of that thesis. The pattern it establishes — data at rest in columnar format, computation in the client, zero server-side query execution — is likely to become a standard deployment model for internal analytics tools.*</p></div></section>);
const Footer=()=>(<footer style={{borderTop:"1px solid var(--border)",padding:"28px 24px",background:"var(--surface)"}}><div style={{maxWidth:"1100px",margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:"12px"}}><div><span style={{fontWeight:700,fontSize:"1rem",color:"var(--text)"}}>Retail Analytics · <span style={{color:"var(--accent)"}}>Capability</span></span><p style={{fontSize:".72rem",color:"var(--muted)",fontFamily:"JetBrains Mono",marginTop:"4px",opacity:.6}}>github.com/arvind3/retail_analytics · * inferred / estimated from repo analysis</p></div><div style={{display:"flex",gap:"14px",alignItems:"center",fontSize:".85rem"}}><a href="./product.html" style={{color:"var(--muted)"}}>← Product</a><a href="./executive.html" style={{color:"var(--muted)"}}>Executive →</a></div></div></footer>);
const App=()=>(<div><Nav/><Hero/><CrossDomain/><BuildingBlocks/><CombinationPlays/><Emerging/><Footer/></div>);
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
