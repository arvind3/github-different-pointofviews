<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retail Analytics · Executive Summary</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--ink:#0a0a14;--surface:#12121f;--card:#1a1a2e;--border:#2a2a45;--primary:#6366f1;--primary-light:#818cf8;--accent:#f59e0b;--text:#e2e8f0;--muted:#94a3b8;--green:#10b981;--pink:#ec4899;}
    *{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}
    body{background:var(--ink);color:var(--text);font-family:"Plus Jakarta Sans",sans-serif;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
    .fu{animation:fadeUp .6s ease both;}.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}
    .section-label{font-family:"JetBrains Mono",monospace;font-size:.72rem;color:var(--pink);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
    .metric-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;text-align:center;}
    nav a{transition:color .2s;}a{text-decoration:none;}
  
    /* mobile-friendly patch v1 */
    @media (max-width: 900px) {
      html, body { overflow-x: hidden; }
      nav, .site-nav { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
      .nav-inner, nav > div { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
      .nav-links { display: none !important; }
      .hamburger { display: block !important; }
      .mobile-menu { display: none; }
      .mobile-menu.open { display: flex !important; }
      .content, .page-body, section, main, .hero { padding-left: 1rem !important; padding-right: 1rem !important; }
      .hero { padding-top: 2.5rem !important; }
      .hero h1, h1 { font-size: clamp(1.5rem, 7vw, 2.1rem) !important; line-height: 1.2 !important; }
      h2 { font-size: clamp(1.25rem, 5.2vw, 1.7rem) !important; }
      .kpis-inner, .opp-grid, .value-grid, .big-number-row, .cards-grid, .grid, [class*='grid-cols-'] {
        grid-template-columns: 1fr !important;
      }
      .metric-card, .value-card, .card, .big-number { padding: 1rem !important; }
      .btn, button, a[role='button'], .nav-links a, .mobile-menu a { min-height: 44px; }
      .quote-block, .what-block, .opp-stat-block { padding: 1rem !important; }
    }
    @media (max-width: 520px) {
      body { font-size: 15px; }
      .tag, .section-label { font-size: 0.68rem !important; }
    }

  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const GH=()=>(<svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>);
const Nav=()=>(<nav style={{background:"rgba(10,10,20,.95)",backdropFilter:"blur(16px)",borderBottom:"1px solid var(--border)",position:"sticky",top:0,zIndex:50}}><div style={{maxWidth:"1100px",margin:"0 auto",padding:"0 24px",display:"flex",alignItems:"center",justifyContent:"space-between",height:"60px"}}><a href="./index.html" style={{fontWeight:700,fontSize:"1rem",color:"var(--text)"}}><span style={{color:"var(--primary-light)"}}>Retail</span> Analytics</a><div style={{display:"flex",gap:"20px",alignItems:"center",fontSize:".85rem"}}><a href="./engineering.html" style={{color:"var(--muted)"}}>Engineering</a><a href="./product.html" style={{color:"var(--muted)"}}>Product</a><a href="./capability.html" style={{color:"var(--muted)"}}>Capability</a><a href="./executive.html" style={{color:"var(--pink)",fontWeight:600}}>Executive</a><a href="https://github.com/arvind3/retail_analytics" target="_blank" style={{color:"var(--muted)",border:"1px solid var(--border)",padding:"5px 12px",borderRadius:"6px",display:"flex",alignItems:"center",gap:"6px",fontFamily:"JetBrains Mono",fontSize:".78rem"}}><GH/> GitHub</a></div></div></nav>);
const Hero=()=>(<section style={{padding:"80px 24px 64px",textAlign:"center",background:"var(--ink)",borderBottom:"1px solid var(--border)"}}><div style={{maxWidth:"800px",margin:"0 auto",position:"relative"}}><div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse 80% 60% at 50% 0%,rgba(236,72,153,0.1),transparent)",pointerEvents:"none"}}/><div className="fu" style={{marginBottom:"16px"}}><span style={{background:"rgba(236,72,153,.1)",border:"1px solid rgba(236,72,153,.25)",color:"var(--pink)",borderRadius:"20px",padding:"4px 14px",fontSize:".75rem",fontFamily:"JetBrains Mono",fontWeight:500}}>Executive Summary</span></div><h1 className="fu d1" style={{fontSize:"clamp(2rem,5vw,3.4rem)",fontWeight:800,lineHeight:1.12,letterSpacing:"-.03em",marginBottom:"20px"}}>We built a retail analytics platform<br/>that requires<span style={{background:"linear-gradient(135deg,#ec4899,#818cf8)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",backgroundClip:"text"}}> no infrastructure — and works anyway.</span></h1><p className="fu d2" style={{fontSize:"1.1rem",color:"var(--muted)",lineHeight:1.8,maxWidth:"580px",margin:"0 auto"}}>The conventional wisdom says analytics at scale requires servers, databases, and data engineering teams. This platform challenges that assumption — and proves it wrong.</p></div></section>);
const Opportunity=()=>(<section style={{padding:"64px 24px",maxWidth:"900px",margin:"0 auto"}}><p className="section-label">The Opportunity</p><h2 style={{fontSize:"1.75rem",fontWeight:700,marginBottom:"20px"}}>A $40B analytics market built on unnecessary complexity</h2><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"24px",marginBottom:"32px"}}>{[{v:"$50K–$200K*",l:"Annual BI tool cost for a mid-size retail team",sub:"Tableau, Looker, or Power BI + cloud data warehouse"},{v:"2–3 days*",l:"Average time from question to insight in traditional stacks",sub:"Data team queues, report formatting, stakeholder delivery"},{v:"60–80%*",l:"Of retail decisions made before data arrives",sub:"Meetings happen faster than reporting cycles"},{v:"$0",l:"Infrastructure cost for this platform",sub:"GitHub Pages, open source, no licence fees"}].map((m,i)=>(<div key={i} className="metric-card"><div style={{fontSize:"2rem",fontWeight:800,background:"linear-gradient(135deg,#ec4899,#818cf8)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",backgroundClip:"text",marginBottom:"6px"}}>{m.v}</div><div style={{fontWeight:600,fontSize:".9rem",marginBottom:"4px",color:"var(--text)"}}>{m.l}</div><div style={{fontSize:".75rem",color:"var(--muted)"}}>{m.sub}</div></div>))}</div><p style={{color:"var(--muted)",lineHeight:1.85,fontSize:"1rem"}}>The retail analytics market is massive — but most of that spend goes toward infrastructure overhead, not analytical insight. Category managers, buyers, and regional directors spend more time waiting for data than acting on it. The tools that could help them are locked behind IT provisioning processes, licence budgets, and data engineering queues.</p></section>);
const WhatWeBuilt=()=>(<section style={{padding:"0 24px 64px",maxWidth:"900px",margin:"0 auto"}}><p className="section-label">What We Built</p><h2 style={{fontSize:"1.75rem",fontWeight:700,marginBottom:"20px"}}>A zero-infrastructure retail intelligence platform</h2><div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"14px",padding:"32px",lineHeight:1.9}}><p style={{fontSize:"1.05rem",color:"var(--text)",marginBottom:"16px"}}><strong style={{color:"white"}}>What it is:</strong> A production-ready web application that delivers executive dashboards, customer intelligence, and ad-hoc SQL analytics — running entirely in the user's browser with no backend server.</p><p style={{fontSize:"1.05rem",color:"var(--text)",marginBottom:"16px"}}><strong style={{color:"white"}}>Who it's for:</strong> Retail category teams, data analysts, and executive decision-makers in CPG and grocery retail who need immediate access to performance, customer, and promotion data.</p><p style={{fontSize:"1.05rem",color:"var(--text)"}}><strong style={{color:"white"}}>What it does:</strong> Executes full ANSI SQL queries against optimised Parquet datasets using DuckDB-WASM — an in-browser analytical engine — and renders results as interactive ECharts visualisations. Deployed to GitHub Pages. No server to provision, no licence to buy, no login to create.</p></div></section>);
const Traction=()=>(<section style={{padding:"0 24px 64px",maxWidth:"900px",margin:"0 auto"}}><p className="section-label">Traction & Evidence</p><h2 style={{fontSize:"1.75rem",fontWeight:700,marginBottom:"28px"}}>Capability signals that matter</h2><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:"14px"}}>{[{icon:"🚀",label:"Live production deployment",sub:"Available at arvind3.github.io/retail_analytics — works today, no setup"},{icon:"🧪",label:"Full test coverage",sub:"Vitest unit tests + Playwright E2E on Chromium validate every release"},{icon:"⚡",label:"Sub-second query response*",sub:"DuckDB-WASM vectorised engine — faster than most BI cloud APIs"},{icon:"🔒",label:"Privacy-native architecture",sub:"Zero server-side data processing — data stays in the user's browser"},{icon:"📦",label:"Production-grade stack",sub:"TypeScript, React 18, automated CI/CD — not a prototype"},{icon:"🌐",label:"Zero infrastructure cost",sub:"GitHub Pages hosting — $0/month regardless of traffic"}].map((t,i)=>(<div key={i} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:"12px",padding:"20px"}}><div style={{fontSize:"1.6rem",marginBottom:"8px"}}>{t.icon}</div><p style={{fontWeight:700,fontSize:".9rem",marginBottom:"6px",color:"var(--text)"}}>{t.label}</p><p style={{fontSize:".78rem",color:"var(--muted)",lineHeight:1.5}}>{t.sub}</p></div>))}</div></section>);
const StrategicValue=()=>(<section style={{padding:"0 24px 64px",maxWidth:"900px",margin:"0 auto"}}><p className="section-label">Strategic Value</p><h2 style={{fontSize:"1.75rem",fontWeight:700,marginBottom:"20px"}}>Why this matters beyond retail</h2><div style={{display:"flex",flexDirection:"column",gap:"16px"}}>{[{heading:"The architecture is the moat",body:"DuckDB-WASM + Parquet + static hosting is a stackable pattern. The platform's value isn't just the retail dashboards — it's the proof-of-concept that enterprise-grade analytics can be delivered as a static URL. Every domain that needs fast, private, zero-infra analytics is a potential application.*"},{heading:"Defensibility through open-source and zero-cost distribution",body:"Because this runs on GitHub Pages with no infrastructure cost, it can be forked, deployed, and shared by any team with a laptop. That virality is a distribution advantage that paid BI tools cannot match. Open source is the go-to-market strategy.*"},{heading:"Platform potential: any dataset, same engine",body:"The DuckDB-WASM query engine is dataset-agnostic. Replace the retail Parquet with e-commerce clickstreams, healthcare operational data, or financial transactions — the UI, the SQL Studio, and the chart library all work unchanged. This is a platform, not a single-use tool.*"}].map((s,i)=>(<div key={i} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"12px",padding:"24px",borderLeft:`3px solid var(--pink)`}}><h3 style={{fontWeight:700,fontSize:"1rem",marginBottom:"8px",color:"var(--text)"}}>{s.heading}</h3><p style={{fontSize:".88rem",color:"var(--muted)",lineHeight:1.75}}>{s.body}</p></div>))}</div></section>);
const TheAsk=()=>(<section style={{padding:"0 24px 48px",maxWidth:"900px",margin:"0 auto"}}><p className="section-label">Next Step</p><h2 style={{fontSize:"1.75rem",fontWeight:700,marginBottom:"20px"}}>See it in your context</h2><div style={{background:"linear-gradient(135deg,rgba(236,72,153,.07),rgba(99,102,241,.1))",border:"1px solid rgba(236,72,153,.25)",borderRadius:"14px",padding:"36px",textAlign:"center"}}><p style={{fontSize:"1.05rem",color:"var(--text)",lineHeight:1.8,maxWidth:"520px",margin:"0 auto 28px"}}>The fastest way to evaluate this platform is to open it. No demo to schedule, no account to create. Click the link — you'll have live retail KPIs, cohort analysis, and a SQL workspace in under five seconds.</p><div style={{display:"flex",gap:"14px",justifyContent:"center",flexWrap:"wrap",marginBottom:"20px"}}><a href="https://arvind3.github.io/retail_analytics/#/" target="_blank" style={{display:"inline-flex",alignItems:"center",gap:"8px",padding:"14px 32px",background:"linear-gradient(135deg,#ec4899,#818cf8)",color:"white",borderRadius:"10px",fontWeight:800,fontSize:"1rem"}}>Open the Platform →</a><a href="https://github.com/arvind3/retail_analytics" target="_blank" style={{display:"inline-flex",alignItems:"center",gap:"8px",padding:"14px 28px",background:"var(--card)",color:"var(--text)",border:"1px solid var(--border)",borderRadius:"10px",fontWeight:600,fontSize:"1rem"}}><GH/> Review the Code</a></div></div></section>);
const FounderQuote=()=>(<section style={{padding:"0 24px 80px",maxWidth:"900px",margin:"0 auto"}}><div style={{background:"linear-gradient(135deg,rgba(236,72,153,.06),rgba(99,102,241,.08))",borderLeft:"4px solid var(--pink)",borderRadius:"0 12px 12px 0",padding:"28px 32px"}}><p style={{fontSize:"1.2rem",fontWeight:600,color:"var(--text)",lineHeight:1.75,marginBottom:"16px",fontStyle:"italic"}}>"The frustration was watching retail teams make million-dollar category decisions based on gut instinct — not because the data didn't exist, but because the tools that held it were behind a ticket queue. We built this to prove that analytics infrastructure is optional. The insight is what matters, and it should take seconds, not days, to get there."*</p><p style={{fontSize:".82rem",color:"var(--muted)",fontFamily:"JetBrains Mono"}}>* Representative narrative inferred from architecture and design choices in the repository</p></div></section>);
const Footer=()=>(<footer style={{borderTop:"1px solid var(--border)",padding:"28px 24px",background:"var(--surface)"}}><div style={{maxWidth:"900px",margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:"12px"}}><div><span style={{fontWeight:700,fontSize:"1rem",color:"var(--text)"}}>Retail Analytics · <span style={{color:"var(--pink)"}}>Executive</span></span><p style={{fontSize:".72rem",color:"var(--muted)",fontFamily:"JetBrains Mono",marginTop:"4px",opacity:.6}}>github.com/arvind3/retail_analytics · * all estimates inferred from repo analysis</p></div><div style={{display:"flex",gap:"14px",alignItems:"center",fontSize:".85rem"}}><a href="./capability.html" style={{color:"var(--muted)"}}>← Capability</a><a href="./index.html" style={{color:"var(--muted)"}}>Hub →</a></div></div></footer>);
const App=()=>(<div><Nav/><Hero/><Opportunity/><WhatWeBuilt/><Traction/><StrategicValue/><TheAsk/><FounderQuote/><Footer/></div>);
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
